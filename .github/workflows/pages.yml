name: Publish dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 13 5,12 * *'
    - cron: '35 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh public market data
        run: |
          python -m unittest test_update_daily
          python -m pip install openpyxl==3.1.5
          if ! python update_market.py; then
            echo '::warning::Monthly update unavailable. Reusing the last published monthly data.'
            curl --fail --silent --show-error --location --max-time 20 \
              https://dani3lsamir.github.io/materias-primas/market.json -o market.json
          fi
          python update_daily.py --previous-url https://dani3lsamir.github.io/materias-primas/daily.json
      - uses: actions/configure-pages@v5
      - name: Build Pages and offline HTML
        run: python build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact to be visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..8}; do
            if [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq 'any(.artifacts[]; .name == "github-pages" and (.expired | not))')" == 'true' ]]; then
              exit 0
            fi
            sleep 4
          done
          echo '::error::GitHub Pages artifact is not visible to the deployment API.'
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
